<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>添加服务器 · Test_Prompt</title>
<style>
  :root{
    --bg:#060a12;
    --panel:rgba(13,21,36,.86);
    --line:#1c2a44;
    --line-soft:rgba(120,160,220,.12);
    --text:#e6f1ff;
    --text-dim:#9db0d4;
    --muted:#6f83a8;
    --cyan:#22d3ee;
    --blue:#3b82f6;
    --violet:#8b5cf6;
    --danger:#ef4444;
    --ok:#34d399;
    --radius:14px;
    --shadow:0 18px 48px rgba(2,8,20,.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    color:var(--text);
    background:
      radial-gradient(1100px 620px at 12% -10%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(900px 560px at 96% 4%, rgba(139,92,246,.16), transparent 62%),
      radial-gradient(700px 700px at 60% 120%, rgba(59,130,246,.12), transparent 60%),
      var(--bg);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(120,170,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,.055) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 30%, transparent 88%);
    mask-image:radial-gradient(circle at 50% 22%, #000 30%, transparent 88%);
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* ============ 布局 ============ */
  .app{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden;}

  /* ============ 左侧菜单 ============ */
  .sidebar{
    width:252px;flex:0 0 252px;display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(11,18,32,.96), rgba(6,10,18,.96));
    border-right:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .brand{
    display:flex;align-items:center;gap:11px;
    padding:17px 18px;border-bottom:1px solid var(--line);
  }
  .brand .logo{
    width:38px;height:38px;border-radius:11px;flex:0 0 38px;
    display:grid;place-items:center;
    background:linear-gradient(140deg, rgba(34,211,238,.95), rgba(59,130,246,.9) 55%, rgba(139,92,246,.92));
    box-shadow:0 0 0 1px rgba(140,220,255,.35), 0 8px 22px rgba(34,211,238,.35);
  }
  .brand .logo svg{width:21px;height:21px;stroke:#04121f;}
  .brand .title{
    font-size:17px;font-weight:700;letter-spacing:.4px;
    background:linear-gradient(90deg,#e8f7ff,#67e8f9 60%,#a78bfa);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase;margin-top:2px;}

  .nav{flex:1;overflow:auto;padding:12px 10px 22px;}
  .nav::-webkit-scrollbar{width:8px;}
  .nav::-webkit-scrollbar-thumb{background:#1d2c46;border-radius:8px;}

  .nav-label{
    font-size:11px;letter-spacing:1.6px;color:var(--muted);
    text-transform:uppercase;padding:10px 12px 8px;
  }

  .m1{margin-bottom:4px;}
  .m1 > .m1-head,
  .m2 > .m2-head{
    display:flex;align-items:center;gap:10px;width:100%;
    background:transparent;border:0;color:var(--text-dim);
    padding:10px 12px;border-radius:10px;cursor:pointer;
    font-size:13.5px;text-align:left;transition:.18s;
  }
  .m1 > .m1-head:hover,
  .m2 > .m2-head:hover{background:rgba(120,170,255,.07);color:#dceaff;}
  .m1 > .m1-head .ico{width:16px;height:16px;opacity:.85;}
  .m2 > .m2-head .ico{width:14px;height:14px;opacity:.7;}
  .m1 > .m1-head .txt,.m2 > .m2-head .txt{flex:1;}
  .chev{width:14px;height:14px;transition:transform .2s;}
  .open > .m1-head .chev,.open > .m2-head .chev{transform:rotate(90deg);}

  .m2-wrap,.m3-wrap{display:none;}
  .open > .m2-wrap{display:block;}
  .m2.open > .m3-wrap{display:block;}

  .m2{margin:2px 0 2px 6px;}
  .m2 > .m2-head{padding:9px 12px;font-size:13px;}

  .m3{margin:1px 0 1px 10px;border-left:1px solid var(--line);padding-left:6px;}
  .m3 a{
    display:flex;align-items:center;gap:9px;
    padding:8px 12px;border-radius:9px;color:var(--muted);font-size:12.5px;
    transition:.18s;position:relative;
  }
  .m3 a .dot{width:5px;height:5px;border-radius:50%;background:#2b3d5c;transition:.18s;}
  .m3 a:hover{color:#dceaff;background:rgba(120,170,255,.07);}
  .m3 a:hover .dot{background:#5f7ea8;}
  .m3 a.active{
    color:#eafcff;background:linear-gradient(90deg, rgba(34,211,238,.16), rgba(34,211,238,.02));
    box-shadow:inset 0 0 0 1px rgba(34,211,238,.28);
  }
  .m3 a.active .dot{background:var(--cyan);box-shadow:0 0 9px var(--cyan);}
  .m3 a.active::before{
    content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:2px;height:16px;background:var(--cyan);border-radius:2px;box-shadow:0 0 10px var(--cyan);
  }
  /* ============ 右侧主区 ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}

  .topbar{
    height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(13,21,36,.75), rgba(13,21,36,.25));
    backdrop-filter:blur(8px);
  }
  .crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .crumbs .sep{opacity:.45;}
  .crumbs .cur{color:#e8f7ff;font-weight:600;}
  .topbar .right{display:flex;align-items:center;gap:14px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#b8e9f5;
    padding:6px 12px;border-radius:999px;background:rgba(34,211,238,.08);
    border:1px solid rgba(34,211,238,.28);
  }
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .avatar{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
    color:#04121f;background:linear-gradient(135deg,#67e8f9,#818cf8);
  }

  .content{flex:1;overflow:auto;padding:20px 22px 26px;}
  .content::-webkit-scrollbar{width:10px;}
  .content::-webkit-scrollbar-thumb{background:#1d2c46;border-radius:10px;}

  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px;}
  .hero h1{margin:0;font-size:20px;letter-spacing:.5px;}
  .hero h1 span{
    background:linear-gradient(90deg,#eafcff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin:7px 0 0;font-size:12.5px;color:var(--muted);}
  .hero .glow-line{
    height:2px;width:120px;margin-top:12px;border-radius:2px;
    background:linear-gradient(90deg,var(--cyan),rgba(139,92,246,0));
    box-shadow:0 0 14px rgba(34,211,238,.7);
  }

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .panel::before{
    content:"";display:block;height:1px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),rgba(139,92,246,.45),transparent);
  }

  /* 搜索 + 操作区 */
  .toolbar{
    display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
    padding:16px 18px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .filters{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--muted);letter-spacing:.3px;}
  .input{
    width:212px;height:38px;padding:0 13px;border-radius:9px;
    background:#0a1322;border:1px solid #21354f;color:var(--text);font-size:13px;
    transition:.18s;outline:none;
  }
  .input::placeholder{color:#4d6187;}
  .input:focus{border-color:rgba(34,211,238,.75);box-shadow:0 0 0 3px rgba(34,211,238,.13);background:#0b1626;}

  .btn{
    height:38px;padding:0 16px;border-radius:9px;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;justify-content:center;
    border:1px solid transparent;transition:.18s;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;}
  .btn-primary{
    background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#03131f;font-weight:700;
    box-shadow:0 8px 22px rgba(34,211,238,.28);
  }
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 10px 26px rgba(34,211,238,.4);}
  .btn-ghost{background:#101c2e;border-color:#23385a;color:#cfe2ff;}
  .btn-ghost:hover{border-color:rgba(34,211,238,.6);color:#eafcff;background:#122238;}
  .btn-danger{
    background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.5);color:#ffb4b4;
  }
  .btn-danger:hover:not(:disabled){background:rgba(239,68,68,.22);color:#fff;box-shadow:0 8px 20px rgba(239,68,68,.25);}
  .btn-danger:disabled{
    opacity:.4;cursor:not-allowed;background:rgba(255,255,255,.03);
    border-color:#243447;color:#7d8ba3;box-shadow:none;
  }
  .actions{display:flex;align-items:center;gap:10px;}
  /* 表格 */
  .table-wrap{overflow:auto;}
  .table-wrap::-webkit-scrollbar{height:10px;width:10px;}
  .table-wrap::-webkit-scrollbar-thumb{background:#1d2c46;border-radius:10px;}
  table{width:100%;border-collapse:collapse;min-width:760px;}
  thead th{
    position:sticky;top:0;z-index:2;
    text-align:left;font-size:12px;font-weight:600;letter-spacing:.8px;color:#8ea3c8;
    padding:12px 16px;background:#0c1626;border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:14px 16px;font-size:13.5px;border-bottom:1px solid rgba(120,160,220,.09);
    color:var(--text-dim);vertical-align:middle;
  }
  tbody tr{transition:.15s;}
  tbody tr:hover{background:rgba(34,211,238,.045);}
  tbody tr.checked{background:rgba(34,211,238,.07);}
  tbody tr:last-child td{border-bottom:0;}
  .col-check{width:52px;}
  .col-name{width:26%;}
  .col-company{width:22%;}

  input[type="checkbox"]{
    width:16px;height:16px;accent-color:#22d3ee;cursor:pointer;
    vertical-align:middle;filter:drop-shadow(0 0 5px rgba(34,211,238,.35));
  }
  .lnk{
    color:#67e8f9;font-weight:600;position:relative;
    border-bottom:1px dashed rgba(103,232,249,.45);padding-bottom:1px;transition:.18s;
  }
  .lnk:hover{color:#c8f8ff;border-bottom-color:#67e8f9;text-shadow:0 0 12px rgba(34,211,238,.6);}
  .lnk .ext{opacity:.5;font-size:11px;margin-left:3px;}
  .api{
    font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-size:12.5px;color:#9fb6dc;
    background:rgba(10,19,34,.75);border:1px solid #1d2f4b;border-radius:7px;
    padding:5px 10px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .badge{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:8px;
    color:#a5f3fc;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.28);vertical-align:middle;
  }
  .empty{display:none;padding:56px 20px;text-align:center;color:var(--muted);}
  .empty svg{width:44px;height:44px;opacity:.5;margin-bottom:12px;}
  .empty p{margin:0;font-size:13px;}

  /* 底部状态栏 */
  .panel-foot{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:12px 18px;border-top:1px solid var(--line-soft);background:rgba(255,255,255,.015);
    font-size:12.5px;color:var(--muted);
  }
  .panel-foot b{color:#8ff0ff;font-weight:600;}
  .pager{display:flex;align-items:center;gap:6px;}
  .pager button{
    min-width:30px;height:30px;padding:0 9px;border-radius:8px;cursor:pointer;font-size:12.5px;
    background:#0f1c2e;border:1px solid #22375a;color:#a9bfe2;transition:.16s;
  }
  .pager button:hover:not(:disabled){border-color:rgba(34,211,238,.6);color:#eafcff;}
  .pager button.on{background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#03131f;font-weight:700;border-color:transparent;}
  .pager button:disabled{opacity:.35;cursor:not-allowed;}

  /* ============ 确认弹窗 ============ */
  .modal-mask{
    position:fixed;inset:0;z-index:50;display:none;place-items:center;
    background:rgba(3,7,14,.72);backdrop-filter:blur(5px);
  }
  .modal-mask.show{display:grid;}
  .modal{
    width:min(430px,92vw);border-radius:16px;padding:22px 24px 20px;
    background:linear-gradient(180deg,#101c30,#0b1424);
    border:1px solid rgba(239,68,68,.35);
    box-shadow:0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(34,211,238,.08) inset;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .modal h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:10px;}
  .modal h3 .warn{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px;
    background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.4);color:#fca5a5;
  }
  .modal h3 .warn svg{width:17px;height:17px;}
  .modal p{margin:0;font-size:13px;line-height:1.7;color:#a9bfe2;}
  .modal .target{
    margin:12px 0 4px;padding:10px 12px;border-radius:9px;font-size:12.5px;color:#bff3ff;
    background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.22);
    max-height:120px;overflow:auto;
  }
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* ============ Toast ============ */
  .toast{
    position:fixed;right:24px;bottom:24px;z-index:60;
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;border-radius:11px;font-size:13px;color:#d9fbff;
    background:linear-gradient(180deg,rgba(13,28,44,.97),rgba(9,18,32,.97));
    border:1px solid rgba(34,211,238,.4);box-shadow:0 16px 40px rgba(0,0,0,.5);
    opacity:0;transform:translateY(14px);pointer-events:none;transition:.25s;
  }
  .toast.show{opacity:1;transform:none;}
  .toast svg{width:16px;height:16px;color:var(--ok);}

  @media (max-width:900px){
    .sidebar{width:210px;flex-basis:210px;}
    .input{width:100%;min-width:150px;}
    .field{flex:1 1 150px;}
  }

  /* ============ 表单页 ============ */
  .panel-head{
    display:flex;align-items:center;gap:10px;padding:14px 18px;
    border-bottom:1px solid var(--line-soft);font-size:13.5px;font-weight:600;color:#dceaff;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .panel-head .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);}
  .panel-head small{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted);}

  .form-layout{display:grid;grid-template-columns:minmax(0,1fr) 326px;align-items:stretch;}
  .form-body{padding:22px 18px 2px;min-width:0;}
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;}
  .form-grid .span-2{grid-column:1 / -1;}
  .form-grid .input{width:100%;}
  .req{color:#f87171;font-style:normal;margin-left:3px;}
  .field .hint{margin-top:7px;font-size:11.5px;color:var(--muted);line-height:1.55;}
  .field .err{display:none;margin-top:7px;font-size:11.5px;color:#fca5a5;}
  .field.invalid .err{display:block;}
  .field.invalid .hint{display:none;}
  .field.invalid > .input,
  .field.invalid .combo .input{border-color:rgba(239,68,68,.7);box-shadow:0 0 0 3px rgba(239,68,68,.12);}
  .input.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-size:12.5px;}
  .input:disabled{opacity:.6;cursor:not-allowed;}

  /* 可编辑下拉框 */
  .combo{position:relative;}
  .combo .input{padding-right:40px;}
  .combo-btn{
    position:absolute;right:1px;top:1px;width:38px;height:36px;border:0;border-radius:0 8px 8px 0;
    background:transparent;color:#7d94bb;cursor:pointer;display:grid;place-items:center;transition:.16s;
  }
  .combo-btn:hover{color:#eafcff;background:rgba(34,211,238,.09);}
  .combo-btn svg{width:14px;height:14px;transition:transform .2s;}
  .combo.open .combo-btn svg{transform:rotate(180deg);}
  .combo-list{
    position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);
    padding:6px;display:none;max-height:238px;overflow:auto;
    background:linear-gradient(180deg,#0e1a2c,#0b1424);
    border:1px solid #22385a;border-radius:10px;
    box-shadow:0 22px 50px rgba(0,0,0,.62), 0 0 0 1px rgba(34,211,238,.06) inset;
    animation:pop .14s ease-out;
  }
  .combo.open .combo-list{display:block;}
  .combo-list::-webkit-scrollbar{width:8px;}
  .combo-list::-webkit-scrollbar-thumb{background:#1d2c46;border-radius:8px;}
  .combo-item{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
    font-size:13px;color:var(--text-dim);cursor:pointer;transition:.14s;
  }
  .combo-item:hover,.combo-item.on{background:rgba(34,211,238,.1);color:#eafcff;}
  .combo-item .tag{
    margin-left:auto;font-size:10.5px;color:#7fd6e8;padding:1px 7px;border-radius:999px;
    border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.07);
  }
  .combo-item mark{background:transparent;color:#67e8f9;font-weight:700;}
  .combo-empty{padding:11px 10px;font-size:12.5px;color:var(--muted);}

  .form-foot{
    display:flex;align-items:center;gap:10px;padding:18px;
    border-top:1px solid var(--line-soft);
  }
  .form-foot .tip{margin-left:auto;font-size:12px;color:var(--muted);}

  /* 右侧预览 */
  .side{
    padding:20px 18px;border-left:1px solid var(--line);
    background:rgba(255,255,255,.012);
  }
  .side h4{
    margin:0 0 12px;font-size:13px;color:#cfe2ff;letter-spacing:.4px;
    display:flex;align-items:center;gap:8px;
  }
  .side h4 svg{width:15px;height:15px;color:var(--cyan);}
  .preview{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(10,19,34,.6);}
  .preview .pv-name{font-size:14px;font-weight:700;color:#eafcff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .preview .pv-line{font-size:12.5px;color:var(--text-dim);margin-top:9px;word-break:break-all;}
  .preview .pv-line .k{color:var(--muted);margin-right:6px;}
  .preview .pv-line.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-size:12px;color:#9fb6dc;}
  .preview .pv-home{color:#67e8f9;}
  .ph{color:#4d6187;font-style:italic;}
  .tips{margin-top:16px;font-size:12px;line-height:1.85;color:var(--muted);}
  .tips b{color:#a9bfe2;font-weight:600;}
  .tips div{padding-left:14px;position:relative;}
  .tips div::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#2b3d5c;}

  @media (max-width:1120px){
    .form-layout{grid-template-columns:minmax(0,1fr);}
    .side{border-left:0;border-top:1px solid var(--line);}
  }
  @media (max-width:760px){
    .form-grid{grid-template-columns:minmax(0,1fr);}
  }
</style>
</head>
<body>
<div class="app">  <!-- ================= 左侧菜单 ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="7" width="10" height="10" rx="2"/>
          <path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>
        </svg>
      </div>
      <div>

<div class="toast" id="toast">
  <svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText">操作成功</span>
</div>

<script>
  /* ---------- 菜单展开 / 收起 ---------- */
  function toggleMenu(id){
    document.getElementById(id).classList.toggle('open');
  }

  /* ---------- 平台 / 官方名：可编辑下拉框 ---------- */
  const OPTIONS     = ['硅基流动', 'OpenRouter', '魔搭社区', 'OpenAI'];  // 默认选项
  const AGGREGATORS = ['硅基流动', 'OpenRouter', '魔搭社区'];            // 列表中标记为聚合平台

  const combo         = document.getElementById('combo');
  const comboList     = document.getElementById('comboList');
  const comboBtn      = document.getElementById('comboBtn');
  const platformInput = document.getElementById('platform');

  let activeIndex = -1;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function highlight(text, q){
    if (!q) return escapeHtml(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return escapeHtml(text);
    return escapeHtml(text.slice(0, i)) +
           '<mark>' + escapeHtml(text.slice(i, i + q.length)) + '</mark>' +
           escapeHtml(text.slice(i + q.length));
  }

  function renderList(){
    const q = platformInput.value.trim();
    const matched = OPTIONS.filter(function(o){
      return o.toLowerCase().indexOf(q.toLowerCase()) > -1;
    });
    activeIndex = -1;

    if (!matched.length){
      comboList.innerHTML = '<div class="combo-empty">没有匹配的内置平台，可直接输入「' +
        escapeHtml(q) + '」作为自定义平台名。</div>';
      return;
    }

    comboList.innerHTML = matched.map(function(name, idx){
      const tag = AGGREGATORS.indexOf(name) > -1 ? '<span class="tag">聚合平台</span>' : '';
      return '<div class="combo-item" role="option" data-name="' + escapeHtml(name) + '" data-idx="' + idx + '">' +
               '<span>' + highlight(name, q) + '</span>' + tag +
             '</div>';
    }).join('');
  }

  function setActive(idx){
    const items = comboList.querySelectorAll('.combo-item');
    for (let i = 0; i < items.length; i++) items[i].classList.toggle('on', i === idx);
    activeIndex = idx;
    if (items[idx]) items[idx].scrollIntoView({ block:'nearest' });
  }

  function openCombo(){
    combo.classList.add('open');
    platformInput.setAttribute('aria-expanded', 'true');
    renderList();
  }

  function closeCombo(){
    combo.classList.remove('open');
    platformInput.setAttribute('aria-expanded', 'false');
    activeIndex = -1;
  }

  function pick(name){
    platformInput.value = name;
    closeCombo();
    clearErr('platform');
    syncPreview();
  }

  platformInput.addEventListener('focus', openCombo);
  platformInput.addEventListener('input', function(){
    openCombo();
    clearErr('platform');
    syncPreview();
  });

  comboBtn.addEventListener('click', function(){
    if (combo.classList.contains('open')){
      closeCombo();
    } else {
      platformInput.focus();
      openCombo();
    }
  });

  comboList.addEventListener('click', function(e){
    const item = e.target.closest('.combo-item');
    if (item) pick(item.dataset.name);
  });

  comboList.addEventListener('mouseover', function(e){
    const item = e.target.closest('.combo-item');
    if (item) setActive(Number(item.dataset.idx));
  });

  platformInput.addEventListener('keydown', function(e){
    const items = comboList.querySelectorAll('.combo-item');

    if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (!combo.classList.contains('open')) return openCombo();
      setActive(Math.min(activeIndex + 1, items.length - 1));
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      setActive(Math.max(activeIndex - 1, 0));
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (combo.classList.contains('open') && activeIndex > -1 && items[activeIndex]){
        pick(items[activeIndex].dataset.name);
      } else {
        save();
      }
    } else if (e.key === 'Escape'){
      closeCombo();
    }
  });

  document.addEventListener('click', function(e){
    if (!combo.contains(e.target)) closeCombo();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeCombo();
  });

  /* ---------- 字段校验 ---------- */
  function setErr(field, msg){
    document.getElementById('err-' + field).textContent = msg;
    document.getElementById('fld-' + field).classList.add('invalid');
  }

  function clearErr(field){
    document.getElementById('fld-' + field).classList.remove('invalid');
  }

  ['baseUrl', 'company', 'home'].forEach(function(id){
    const el = document.getElementById(id);
    el.addEventListener('input', function(){
      clearErr(id);
      syncPreview();
    });
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); save(); }
    });
  });

  /* ---------- 右侧实时预览 ---------- */
  function setText(id, value, placeholder){
    const el = document.getElementById(id);
    if (value){
      el.textContent = value;
      el.classList.remove('ph');
    } else {
      el.textContent = placeholder;
      el.classList.add('ph');
    }
  }

  function syncPreview(){
    const name    = platformInput.value.trim();
    const company = document.getElementById('company').value.trim();
    const baseUrl = document.getElementById('baseUrl').value.trim();
    const home    = document.getElementById('home').value.trim();

    const pvName = document.getElementById('pvName');
    if (name){
      const tag = AGGREGATORS.indexOf(name) > -1 ? '<span class="badge">聚合平台</span>' : '';
      pvName.innerHTML = escapeHtml(name) + tag;
    } else {
      pvName.innerHTML = '<span class="ph">（未填写平台名）</span>';
    }

    setText('pvCompany', company, '（未填写）');
    setText('pvApi', baseUrl, '（未填写）');
    setText('pvHome', home, '（未填写）');
  }

  /* ---------- 保存 / 取消 ---------- */
  const URL_RE = /^https?:\/\/[^\s]+$/i;

  function save(){
    const name    = platformInput.value.trim();
    const baseUrl = document.getElementById('baseUrl').value.trim();
    const home    = document.getElementById('home').value.trim();

    let ok = true;
    let firstBad = null;

    if (!name){
      setErr('platform', '请输入或选择平台 / 官方名');
      ok = false; firstBad = firstBad || 'platform';
    } else {
      clearErr('platform');
    }

    if (!baseUrl){
      setErr('baseUrl', '请输入 api 网址（base_url）');
      ok = false; firstBad = firstBad || 'baseUrl';
    } else if (!URL_RE.test(baseUrl)){
      setErr('baseUrl', '格式不正确，需以 http:// 或 https:// 开头');
      ok = false; firstBad = firstBad || 'baseUrl';
    } else {
      clearErr('baseUrl');
    }

    if (home && !URL_RE.test(home)){
      setErr('home', '格式不正确，需以 http:// 或 https:// 开头');
      ok = false; firstBad = firstBad || 'home';
    } else {
      clearErr('home');
    }

    if (!ok){
      showToast('请检查标红的项后再保存', 'warn');
      const el = document.getElementById(firstBad);
      if (el) el.focus();
      return;
    }

    closeCombo();
    showToast('已保存服务器「' + name + '」');
    setTimeout(function(){ location.href = 'list_server.html'; }, 900);
  }

  function cancel(){
    location.href = 'list_server.html';
  }

  /* ---------- 轻提示 ---------- */
  const TOAST_ICONS = {
    ok:   '<path d="M20 6L9 17l-5-5"/>',
    warn: '<path d="M12 4l9 16H3l9-16z"/><path d="M12 10v4M12 17.5h.01"/>'
  };

  let toastTimer = null;
  function showToast(text, variant){
    const t    = document.getElementById('toast');
    const icon = document.getElementById('toastIcon');
    const isWarn = variant === 'warn';

    document.getElementById('toastText').textContent = text;
    icon.innerHTML = isWarn ? TOAST_ICONS.warn : TOAST_ICONS.ok;
    icon.style.color = isWarn ? '#fca5a5' : '';
    t.style.borderColor = isWarn ? 'rgba(239,68,68,.45)' : '';

    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  syncPreview();
</script>
